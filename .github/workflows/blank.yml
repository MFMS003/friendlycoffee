<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friendly Coffee Space Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #fcf9f4;
      margin: 0;
      padding: 0;
      color: #2f2f2f;
      line-height: 1.6;
    }
    header {
      background: linear-gradient(to right, #4b6e4f, #2e5130);
      color: white;
      padding: 40px 20px;
      text-align: center;
      position: relative;
    }
    header img.logo {
      height: 80px;
      width: auto;
    }
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    header p {
      font-size: 1rem;
      margin-top: 10px;
      opacity: 0.8;
    }
    .menu-section {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }
    .category {
      background-color: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      transition: transform 0.3s ease;
    }
    .category:hover {
      transform: translateY(-5px);
    }
    .category h2 {
      font-size: 1.5rem;
      color: #2e5130;
      border-bottom: 2px solid #ececec;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #ddd;
    }
    .menu-item:last-child {
      border-bottom: none;
    }
    footer {
      text-align: center;
      padding: 30px 20px;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Coffee_beans_icon.svg/1024px-Coffee_beans_icon.svg.png" alt="Logo Friendly Coffee" class="logo">
    </div>
    <p>@friendlycoffeespace</p>
  </header>

  <div class="menu-section">
    <div class="menu-grid">
      <div class="category">
        <h2>Coffee</h2>
        <div class="menu-item"><span>Vietnam Drip</span><span>10K</span></div>
        <div class="menu-item"><span>Americano</span><span>10K</span></div>
        <div class="menu-item"><span>Cappucino</span><span>15K</span></div>
        <div class="menu-item"><span>Coffee Friendly</span><span>15K</span></div>
        <div class="menu-item"><span>Coffee Aren</span><span>17K</span></div>
        <div class="menu-item"><span>Strawberry Latte</span><span>17K</span></div>
        <div class="menu-item"><span>Caramel Latte</span><span>17K</span></div>
        <div class="menu-item"><span>Hazelnut Latte</span><span>17K</span></div>
        <div class="menu-item"><span>Matcha Latte</span><span>18K</span></div>
      </div>

      <div class="category">
        <h2>Non-Coffee</h2>
        <div class="menu-item"><span>Thai Tea</span><span>10K</span></div>
        <div class="menu-item"><span>Passion Yakult</span><span>15K</span></div>
        <div class="menu-item"><span>Lychee Yakult</span><span>15K</span></div>
        <div class="menu-item"><span>Manggo Yakult</span><span>15K</span></div>
        <div class="menu-item"><span>Pinky Milky</span><span>16K</span></div>
        <div class="menu-item"><span>Regal Brown Sugar</span><span>17K</span></div>
        <div class="menu-item"><span>Chocolate Signature</span><span>18K</span></div>
        <div class="menu-item"><span>Chocolate Caramel</span><span>18K</span></div>
        <div class="menu-item"><span>Chocolate Hazelnut</span><span>18K</span></div>
      </div>

      <div class="category">
        <h2>Snack</h2>
        <div class="menu-item"><span>Bakso Bakar</span><span>7K</span></div>
        <div class="menu-item"><span>Tela-Tela</span><span>10K</span></div>
        <div class="menu-item"><span>Ubi Goreng</span><span>10K</span></div>
        <div class="menu-item"><span>Sanggara Peppe</span><span>10K</span></div>
        <div class="menu-item"><span>Roti Bakar</span><span>12K</span></div>
        <div class="menu-item"><span>Peace Roll</span><span>12K</span></div>
        <div class="menu-item"><span>Mie Jbew</span><span>15K</span></div>
        <div class="menu-item"><span>Mix Friendly</span><span>15K</span></div>
      </div>
    </div>
  </div>

  <footer>
    © 2025 Friendly Coffee Space. All rights reserved.
  </footer>
</body>
</html>
